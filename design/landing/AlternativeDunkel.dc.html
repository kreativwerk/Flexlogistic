<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
    a { color: #6E8CFF; } a:hover { color: #A9BEFF; }
  </style>
</helmet>
<div style="width: 480px; min-height: 640px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px; padding: 20px; box-sizing: border-box; border: 1px solid #E7EBF2; border-radius: 12px;">
  <div style="font-size: 14px; font-weight: 700; color: #0F1B2D;">Alternative A – „Nachtschicht“ (komplett dunkel)</div>
  <!-- Wireframe -->
  <div style="display: flex; flex-direction: column; gap: 8px; background: #0A1428; border-radius: 10px; padding: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="width: 70px; height: 10px; border-radius: 4px; background: #3E4C68;"></div>
      <div style="width: 90px; height: 22px; border-radius: 6px; background: #2557E8;"></div>
    </div>
    <div style="width: 300px; height: 22px; border-radius: 5px; background: #E4E9F5; margin-top: 16px;"></div>
    <div style="width: 240px; height: 22px; border-radius: 5px; background: #E4E9F5;"></div>
    <div style="width: 320px; height: 8px; border-radius: 4px; background: #3E4C68; margin-top: 6px;"></div>
    <div style="width: 280px; height: 8px; border-radius: 4px; background: #3E4C68;"></div>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <div style="width: 120px; height: 30px; border-radius: 7px; background: #2557E8;"></div>
      <div style="width: 100px; height: 30px; border-radius: 7px; border: 1px solid #3E4C68;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px;">
      <div style="height: 84px; border-radius: 8px; background: #13223E; border: 1px solid #24365C;"></div>
      <div style="height: 84px; border-radius: 8px; background: #13223E; border: 1px solid #24365C;"></div>
      <div style="height: 84px; border-radius: 8px; background: #13223E; border: 1px solid #24365C;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px;">
      <div style="height: 110px; border-radius: 8px; background: #13223E; border: 1px solid #2557E8;"></div>
      <div style="height: 110px; border-radius: 8px; background: #13223E; border: 1px solid #24365C;"></div>
    </div>
    <div style="height: 54px; border-radius: 8px; background: #2557E8; opacity: 0.85; margin-top: 8px;"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 13px; line-height: 1.5; color: #45526B;"><strong>Dafür:</strong> Maximal eigenständig und „Tech-Logistik“ – hebt sich stark von klassischen Speditions-Websites ab; die blauen Akzente leuchten.</div>
    <div style="font-size: 13px; line-height: 1.5; color: #45526B;"><strong>Dagegen:</strong> Für konservative Industrie-Einkäufer ggf. zu düster; lange Textabschnitte lesen sich auf Dunkel schwerer.</div>
  </div>
</div>
</x-dc>
